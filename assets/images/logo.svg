<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="fc-bg-full" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Specular Sheen Gradient -->
    <linearGradient id="fc-sheen-full" x1="0" y1="0" x2="44" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Bezel Gradient -->
    <linearGradient id="fc-bezel-full" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Citrus Radial Gradient -->
    <radialGradient id="fc-citrus-full" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </radialGradient>

    <!-- Leaves Gradients -->
    <linearGradient id="fc-leaf-lime-full" x1="21" y1="7" x2="33" y2="17" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="fc-leaf-emerald-full" x1="16" y1="7" x2="25" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Basket Gradient -->
    <linearGradient id="fc-basket-full" x1="10" y1="19.5" x2="34" y2="35.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>

    <!-- Text Cart Gradient -->
    <linearGradient id="fc-cart-text" x1="110" y1="12" x2="160" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="fc-shadow-full" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#022c22" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ICON EMBLEM (Offset at x=2, y=2) -->
  <g transform="translate(2, 2)">
    <!-- Base Squircle -->
    <rect width="44" height="44" rx="13" fill="url(#fc-bg-full)"/>

    <!-- Curved Gloss Sheen -->
    <path d="M0 13C0 5.82 5.82 0 13 0H31C38.18 0 44 5.82 44 13V18C30 22 14 17 0 23V13Z" fill="url(#fc-sheen-full)"/>

    <!-- Graphics -->
    <g filter="url(#fc-shadow-full)">
      <!-- Citrus fruit -->
      <circle cx="28.5" cy="19.5" r="5.5" fill="url(#fc-citrus-full)"/>
      <ellipse cx="27" cy="17.5" rx="1.4" ry="0.9" fill="#ffffff" fill-opacity="0.8" transform="rotate(-30 27 17.5)"/>

      <!-- Twin Leaves -->
      <path d="M21 17C21 11.5 26.5 7.2 32.5 6.8C32 12.8 27.2 17 21 17Z" fill="url(#fc-leaf-lime-full)"/>
      <path d="M20 19C15 13.5 18 7.5 24 7.5C24 13.5 22.5 17 20 19Z" fill="url(#fc-leaf-emerald-full)"/>
      <path d="M20 19C21 14.5 24 11.2 27 9" stroke="#14532d" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.8"/>

      <!-- Basket Handle -->
      <path d="M16 20V15C16 12 18.5 9.5 21.5 9.5H22.5C25.5 9.5 28 12 28 15V17" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <!-- Basket Body -->
      <path d="M10 19.5H34L31.5 32.5C31.1 34.3 29.5 35.5 27.6 35.5H16.4C14.5 35.5 12.9 34.3 12.5 32.5L10 19.5Z" fill="url(#fc-basket-full)"/>

      <!-- Basket Rim -->
      <rect x="9" y="18.5" width="26" height="2.5" rx="1.25" fill="#ffffff"/>

      <!-- Basket Texture -->
      <path d="M12 24.5H32M13.5 28.5H30.5" stroke="#10b981" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.35"/>
      <path d="M17.5 21V32M22 21V32M26.5 21V32" stroke="#10b981" stroke-width="1.3" stroke-linecap="round" stroke-opacity="0.3"/>

      <!-- Sparkles -->
      <path d="M10 12.5L11.2 14.5L13.2 15.2L11.2 16L10 18L8.8 16L6.8 15.2L8.8 14.5Z" fill="#fef08a"/>
      <circle cx="10" cy="15.2" r="0.7" fill="#ffffff"/>
    </g>

    <!-- Bezel Highlight -->
    <rect x="0.75" y="0.75" width="42.5" height="42.5" rx="12.25" stroke="url(#fc-bezel-full)" stroke-width="1.5" fill="none"/>
  </g>

  <!-- BRAND NAME & SUBTITLE TYPOGRAPHY -->
  <text x="58" y="27" font-family="'Plus Jakarta Sans', Inter, -apple-system, sans-serif" font-size="22" font-weight="900" letter-spacing="-0.8">
    <tspan fill="#0c2116">Fresh</tspan><tspan fill="url(#fc-cart-text)">Cart</tspan>
  </text>
  
  <!-- Green pulse dot -->
  <circle cx="61" cy="38" r="2.5" fill="#10b981"/>
  
  <!-- Subtitle -->
  <text x="68" y="41" font-family="'Plus Jakarta Sans', Inter, -apple-system, sans-serif" font-size="9" font-weight="800" letter-spacing="1.8" fill="#10b981">
    MARKETPLACE
  </text>
</svg>
