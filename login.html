<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — FreshCart</title>
  <meta name="description" content="Sign in to your FreshCart account to manage grocery orders and delivery addresses.">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="login-page">
    <div class="login-box">
      <a class="logo login-logo" href="index.html" aria-label="FreshCart Homepage">
        <span class="logo-mark">
          <svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="fc-login-bg" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#10b981"/>
                <stop offset="50%" stop-color="#059669"/>
                <stop offset="100%" stop-color="#064e3b"/>
              </linearGradient>
              <linearGradient id="fc-login-sheen" x1="0" y1="0" x2="44" y2="24" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
              </linearGradient>
              <linearGradient id="fc-login-bezel" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
                <stop offset="60%" stop-color="#ffffff" stop-opacity="0.12"/>
                <stop offset="100%" stop-color="#022c22" stop-opacity="0.5"/>
              </linearGradient>
              <radialGradient id="fc-login-citrus" cx="35%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#fef08a"/>
                <stop offset="35%" stop-color="#fb923c"/>
                <stop offset="100%" stop-color="#ea580c"/>
              </radialGradient>
              <linearGradient id="fc-login-leaf-lime" x1="21" y1="7" x2="33" y2="17" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#bef264"/>
                <stop offset="100%" stop-color="#22c55e"/>
              </linearGradient>
              <linearGradient id="fc-login-leaf-emerald" x1="16" y1="7" x2="25" y2="19" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#86efac"/>
                <stop offset="100%" stop-color="#15803d"/>
              </linearGradient>
              <linearGradient id="fc-login-basket" x1="10" y1="19.5" x2="34" y2="35.5" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="50%" stop-color="#f0fdf4"/>
                <stop offset="100%" stop-color="#dcfce7"/>
              </linearGradient>
              <filter id="fc-login-shadow" x="-10%" y="-10%" width="120%" height="130%">
                <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#022c22" flood-opacity="0.3"/>
              </filter>
            </defs>
            <rect width="44" height="44" rx="13" fill="url(#fc-login-bg)"/>
            <path d="M0 13C0 5.82 5.82 0 13 0H31C38.18 0 44 5.82 44 13V18C30 22 14 17 0 23V13Z" fill="url(#fc-login-sheen)"/>
            <g filter="url(#fc-login-shadow)">
              <circle cx="28.5" cy="19.5" r="5.5" fill="url(#fc-login-citrus)"/>
              <ellipse cx="27" cy="17.5" rx="1.4" ry="0.9" fill="#ffffff" fill-opacity="0.8" transform="rotate(-30 27 17.5)"/>
              <path d="M21 17C21 11.5 26.5 7.2 32.5 6.8C32 12.8 27.2 17 21 17Z" fill="url(#fc-login-leaf-lime)"/>
              <path d="M20 19C15 13.5 18 7.5 24 7.5C24 13.5 22.5 17 20 19Z" fill="url(#fc-login-leaf-emerald)"/>
              <path d="M20 19C21 14.5 24 11.2 27 9" stroke="#14532d" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.8"/>
              <path d="M16 20V15C16 12 18.5 9.5 21.5 9.5H22.5C25.5 9.5 28 12 28 15V17" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              <path d="M10 19.5H34L31.5 32.5C31.1 34.3 29.5 35.5 27.6 35.5H16.4C14.5 35.5 12.9 34.3 12.5 32.5L10 19.5Z" fill="url(#fc-login-basket)"/>
              <rect x="9" y="18.5" width="26" height="2.5" rx="1.25" fill="#ffffff"/>
              <path d="M12 24.5H32M13.5 28.5H30.5" stroke="#10b981" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.35"/>
              <path d="M17.5 21V32M22 21V32M26.5 21V32" stroke="#10b981" stroke-width="1.3" stroke-linecap="round" stroke-opacity="0.3"/>
              <path d="M10 12.5L11.2 14.5L13.2 15.2L11.2 16L10 18L8.8 16L6.8 15.2L8.8 14.5Z" fill="#fef08a"/>
              <circle cx="10" cy="15.2" r="0.7" fill="#ffffff"/>
            </g>
            <rect x="0.75" y="0.75" width="42.5" height="42.5" rx="12.25" stroke="url(#fc-login-bezel)" stroke-width="1.5" fill="none"/>
          </svg>
        </span>
        <span class="logo-text">
          <span class="brand-name">
            <span class="brand-fresh">Fresh</span><span class="brand-cart">Cart</span>
          </span>
          <span class="brand-sub">Marketplace</span>
        </span>
      </a>

      <h1>Welcome Back</h1>
      <p>Login to manage your grocery orders.</p>

      <div class="socials">
        <button type="button" class="social" onclick="toast('Google sign-in selected')">
          <svg viewBox="0 0 24 24">
            <path fill="#4285F4" d="M21.35 12.27c0-.77-.07-1.52-.22-2.24H12v4.24h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.7 2.91-4.2 2.91-7.39Z"/>
            <path fill="#34A853" d="M12 21.75c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.74 9.74 0 0 0 12 21.75Z"/>
            <path fill="#FBBC05" d="M6.54 13.83a5.86 5.86 0 0 1 0-3.66V7.64H3.3a9.75 9.75 0 0 0 0 8.72l3.24-2.53Z"/>
            <path fill="#EA4335" d="M12 6.14c1.43 0 2.71.49 3.72 1.46l2.79-2.79C16.84 3.2 14.63 2.25 12 2.25A9.74 9.74 0 0 0 3.3 7.64l3.24 2.53C7.31 7.86 9.46 6.14 12 6.14Z"/>
          </svg>
          Google
        </button>
        <button type="button" class="social" onclick="toast('Apple sign-in selected')">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M16.9 12.7c0-2.5 2.1-3.7 2.2-3.8-1.2-1.7-3.1-1.9-3.8-1.9-1.6-.2-3.1 1-3.9 1-.8 0-2.1-1-3.4-1-1.7 0-3.2 1-4.1 2.5-1.8 3-.5 7.5 1.2 9.9.9 1.2 1.8 2.5 3.1 2.5 1.2-.1 1.7-.8 3.2-.8 1.5 0 1.9.8 3.2.8 1.3 0 2.2-1.2 3-2.4.9-1.3 1.3-2.6 1.3-2.7-.1 0-2-.8-2-3.1Zm-2.6-7.4c.7-.8 1.1-1.9 1-3-.9 0-2 .6-2.7 1.3-.6.7-1.1 1.8-1 2.9 1 .1 2-.5 2.7-1.2Z"/>
          </svg>
          Apple
        </button>
      </div>

      <div class="divider">OR CONTINUE WITH EMAIL</div>

      <form class="auth-fields" onsubmit="handleLogin(event)">
        <div class="auth-field">
          <label for="lEmail">Email</label>
          <input id="lEmail" type="email" required placeholder="you@example.com">
        </div>
        <div class="auth-field">
          <label for="lPass">Password</label>
          <input id="lPass" type="password" required placeholder="Password">
        </div>
        <div class="auth-row">
          <label class="remember">
            <input type="checkbox"> Remember Me
          </label>
          <a class="forgot" href="#" onclick="toast('Password reset email sent'); return false;">
            Forgot Password?
          </a>
        </div>
        <button class="btn btn-primary" type="submit">Login</button>
      </form>

      <div class="auth-switch">
        <span>Don't have an account?</span>
        <a class="auth-link" href="register.html">Sign Up</a>
      </div>

      <p class="auth-note">Demo authentication — no real account is created.</p>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="assets/js/main.js"></script>
  <script>
    function handleLogin(event) {
      event.preventDefault();
      toast("Demo login successful! Redirecting...");
      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 700);
    }
  </script>
</body>
</html>
